name: 'Kodix Security Scanner'
description: 'AI-consensus code security and compliance scanner'
author: 'Kodix Security <gabi@kodixsecurity.com>'
version: '1'  # ← Add this line

branding:
  icon: 'shield'
  color: 'orange'

inputs:
  api_key:
    description: 'Your Kodix API key (generate at kodixsecurity.com/profile)'
    required: true
  mode:
    description: 'Scan mode: "full" scans every source file, "diff" scans only files changed in this push/PR'
    required: false
    default: 'full'
  code_scan:
    description: 'Run the security check on your code ("true" or "false"). Default: true'
    required: false
    default: 'true'
  compliance_scan:
    description: 'Also check your code against the compliance documents uploaded in your Kodix profile ("true" or "false"). Default: false. At least one of code_scan / compliance_scan must be true.'
    required: false
    default: 'false'

outputs:
  scan_id:
    description: 'The Kodix scan ID for this run'
    value: ${{ steps.kodix-run.outputs.scan_id }}
  findings_count:
    description: 'Total number of consensus vulnerabilities found'
    value: ${{ steps.kodix-run.outputs.findings_count }}
  critical_count:
    description: 'Number of CRITICAL severity findings'
    value: ${{ steps.kodix-run.outputs.critical_count }}
  high_count:
    description: 'Number of HIGH severity findings'
    value: ${{ steps.kodix-run.outputs.high_count }}
  medium_count:
    description: 'Number of MEDIUM severity findings'
    value: ${{ steps.kodix-run.outputs.medium_count }}
  low_count:
    description: 'Number of LOW severity findings'
    value: ${{ steps.kodix-run.outputs.low_count }}
  consensus_score:
    description: 'Security score from 0 (worst) to 100 (best)'
    value: ${{ steps.kodix-run.outputs.consensus_score }}
  pdf_url:
    description: 'URL to download the full PDF security report (empty when code_scan is false)'
    value: ${{ steps.kodix-run.outputs.pdf_url }}
  scan_type:
    description: 'What this scan checked: code, compliance or both'
    value: ${{ steps.kodix-run.outputs.scan_type }}
  compliance_findings_count:
    description: 'Total number of compliance violations found'
    value: ${{ steps.kodix-run.outputs.compliance_findings_count }}
  compliance_critical_count:
    description: 'Number of CRITICAL compliance violations'
    value: ${{ steps.kodix-run.outputs.compliance_critical_count }}
  compliance_high_count:
    description: 'Number of HIGH compliance violations'
    value: ${{ steps.kodix-run.outputs.compliance_high_count }}
  compliance_medium_count:
    description: 'Number of MEDIUM compliance violations'
    value: ${{ steps.kodix-run.outputs.compliance_medium_count }}
  compliance_low_count:
    description: 'Number of LOW compliance violations'
    value: ${{ steps.kodix-run.outputs.compliance_low_count }}
  compliance_score:
    description: 'Compliance score from 0 (worst) to 100 (best)'
    value: ${{ steps.kodix-run.outputs.compliance_score }}
  compliance_pdf_url:
    description: 'URL to download the full PDF compliance report'
    value: ${{ steps.kodix-run.outputs.compliance_pdf_url }}

runs:
  using: 'composite'
  steps:

    # ─────────────────────────────────────────────────────────────────────────
    # STEP 1 Discover and collect every readable source file
    # ─────────────────────────────────────────────────────────────────────────
    - name: 🛡️ Kodix Collect files
      id: kodix-collect
      shell: python3 {0}
      run: |
        import os, json, sys, time

        mode       = os.environ.get('INPUT_MODE', 'full').lower()

        # ── What to check: security and/or compliance (at least one) ────────
        def read_flag(name, default):
            raw = (os.environ.get(name, '') or '').strip().lower()
            if raw == '':
                return default
            if raw in ('true', '1', 'yes'):
                return True
            if raw in ('false', '0', 'no'):
                return False
            print(f'\n  ✗ ERROR: {name.replace("INPUT_", "").lower()} must be "true" or "false" (got "{raw}").')
            sys.exit(1)

        code_scan       = read_flag('INPUT_CODE_SCAN', True)
        compliance_scan = read_flag('INPUT_COMPLIANCE_SCAN', False)
        if not code_scan and not compliance_scan:
            print('\n  ✗ ERROR: code_scan and compliance_scan are both "false".')
            print('  At least one of them must be "true". Nothing to do.')
            sys.exit(1)

        event_name = os.environ.get('GITHUB_EVENT_NAME', '')
        repo_name  = os.environ.get('GITHUB_REPOSITORY', 'unknown')
        branch     = os.environ.get('GITHUB_REF_NAME', 'unknown')
        commit_sha = os.environ.get('GITHUB_SHA', '')
        actor      = os.environ.get('GITHUB_ACTOR', '')
        workspace  = os.environ.get('GITHUB_WORKSPACE', '.')
        event_path = os.environ.get('GITHUB_EVENT_PATH', '')

        # Directories that are never source code
        SKIP_DIRS = {
          'node_modules', '.git', '.svn', '.hg',
          'dist', 'build', 'out', '.next', '.nuxt',
          '__pycache__', 'vendor', 'coverage', '.nyc_output',
          '.cache', 'target', '.gradle', '.idea', '.vscode',
          'venv', '.venv', 'env', 'bower_components', '.terraform',
          '.yarn', '.pnpm-store', 'Pods',
        }

        # Whitelist of code file extensions — only actual programming languages.
        # Non-code files (markdown, SQL, YAML, JSON, config, lock files, etc.)
        # waste tokens and do not benefit from security scanning.
        CODE_EXTENSIONS = {
          # Web / JavaScript ecosystem
          '.js', '.jsx', '.ts', '.tsx', '.mjs', '.cjs',
          '.vue', '.svelte', '.astro',
          # HTML / Templates
          '.html', '.htm', '.ejs', '.pug', '.hbs', '.handlebars', '.njk', '.twig', '.jinja', '.jinja2', '.blade.php',
          # Python
          '.py', '.pyw', '.pyi',
          # Go
          '.go',
          # Rust
          '.rs',
          # Java / JVM
          '.java', '.kt', '.kts', '.groovy', '.scala', '.clj', '.cljs',
          # C / C++ / Objective-C
          '.c', '.cpp', '.cc', '.cxx', '.c++', '.h', '.hpp', '.hxx',
          '.m', '.mm',
          # C#
          '.cs', '.csx',
          # Ruby
          '.rb', '.rake', '.gemspec',
          # PHP
          '.php', '.phtml', '.php3', '.php4', '.php5', '.php7', '.php8',
          # Swift
          '.swift',
          # Kotlin
          # (already covered above)
          # Dart / Flutter
          '.dart',
          # Shell scripts
          '.sh', '.bash', '.zsh', '.fish', '.ksh',
          # Solidity / blockchain
          '.sol', '.vy',
          # Elixir / Erlang
          '.ex', '.exs', '.erl', '.hrl',
          # Haskell
          '.hs', '.lhs',
          # Lua
          '.lua',
          # Perl
          '.pl', '.pm', '.t',
          # R
          '.r', '.R',
          # Scala
          # (already above)
          # F# / .NET
          '.fs', '.fsx', '.fsi',
          # Clojure
          # (already above)
          # CoffeeScript
          '.coffee',
          # Elm
          '.elm',
          # OCaml
          '.ml', '.mli',
          # Assembly
          '.asm', '.s',
          # COBOL
          '.cob', '.cbl',
          # Fortran
          '.f', '.f90', '.f95', '.f03',
          # Nim
          '.nim',
          # Zig
          '.zig',
          # D
          '.d',
          # Crystal
          '.cr',
          # V
          '.v',
          # PowerShell
          '.ps1', '.psm1', '.psd1',
          # Batch
          '.bat', '.cmd',
          # Terraform (HCL) — has code logic worth scanning
          '.tf', '.hcl',
          # Makefile
          '.mk',
          # Dockerfile
          '.dockerfile',
        }

        print(f'\n{"═"*68}')
        print(f'  🛡️  KODIX AI SECURITY SCANNER')
        print(f'{"═"*68}')
        print(f'  Repository  : {repo_name}')
        print(f'  Branch      : {branch}')
        print(f'  Commit      : {commit_sha[:8] if commit_sha else "unknown"}')
        print(f'  Triggered by: {actor}')
        print(f'  Scan mode   : {mode.upper()}')
        print(f'  Started at  : {time.strftime("%Y-%m-%d %H:%M:%S UTC", time.gmtime())}')
        print(f'{"═"*68}\n')

        def is_code_file(path):
            """Return True only for known programming-language file extensions."""
            _, ext = os.path.splitext(path)
            # Special case: Dockerfile and Makefile have no extension
            basename = os.path.basename(path).lower()
            if basename in ('dockerfile', 'makefile', 'gemfile', 'rakefile', 'procfile', 'brewfile'):
                return True
            return ext.lower() in CODE_EXTENSIONS

        def is_readable_text(path):
            """Return True if the file can be read as UTF-8 text (not a binary)."""
            try:
                with open(path, 'rb') as fh:
                    chunk = fh.read(8192)
                if b'\x00' in chunk:
                    return False
                chunk.decode('utf-8', errors='strict')
                return True
            except Exception:
                return False

        files = []
        skipped_binary   = 0
        skipped_empty    = 0
        skipped_non_code = 0

        print(f'  ┌{"─"*64}')
        print(f'  │  COLLECTING FILES {mode.upper()} MODE')
        print(f'  ├{"─"*64}')

        if mode == 'diff' and event_path and os.path.exists(event_path):
            try:
                with open(event_path) as fh:
                    event = json.load(fh)
                changed = set()
                for commit in event.get('commits', []):
                    changed.update(commit.get('added', []))
                    changed.update(commit.get('modified', []))
                print(f'  │  Changed files in this push: {len(changed)}')
                print(f'  ├{"─"*64}')

                for fpath in sorted(changed):
                    abs_path = os.path.join(workspace, fpath)
                    if not os.path.isfile(abs_path):
                        continue
                    if any(d in fpath.replace('\\', '/').split('/') for d in SKIP_DIRS):
                        continue
                    if not is_code_file(fpath):
                        skipped_non_code += 1
                        continue
                    if not is_readable_text(abs_path):
                        skipped_binary += 1
                        continue
                    try:
                        with open(abs_path, 'r', errors='replace') as fh:
                            content = fh.read()
                        if not content.strip():
                            skipped_empty += 1
                            continue
                        size_kb = len(content.encode('utf-8', errors='replace')) / 1024
                        files.append({'name': fpath, 'content': content})
                        print(f'  │  + {fpath:<58} {size_kb:>6.1f} KB')
                    except Exception as e:
                        print(f'  │  ⚠ skip {fpath}: {e}')
            except Exception as e:
                print(f'  │  ⚠ Could not parse event payload: {e}')
                print(f'  │  Falling back to FULL scan mode')
                mode = 'full'

        if mode == 'full' or not files:
            if mode != 'full':
                print(f'  │  No diff files switching to FULL mode')
            print(f'  │  Traversing: {workspace}')
            print(f'  ├{"─"*64}')

            for root, dirs, fnames in os.walk(workspace):
                # Prune unwanted directories so os.walk never descends into them
                dirs[:] = sorted([d for d in dirs if d not in SKIP_DIRS])

                rel_root = os.path.relpath(root, workspace).replace('\\', '/')
                parts = rel_root.split('/')
                if any(p in SKIP_DIRS for p in parts):
                    continue

                for fname in sorted(fnames):
                    abs_path = os.path.join(root, fname)
                    rel_path = os.path.relpath(abs_path, workspace).replace('\\', '/')

                    if not is_code_file(rel_path):
                        skipped_non_code += 1
                        continue

                    if not is_readable_text(abs_path):
                        skipped_binary += 1
                        continue

                    try:
                        with open(abs_path, 'r', errors='replace') as fh:
                            content = fh.read()
                        if not content.strip():
                            skipped_empty += 1
                            continue
                        size_kb = len(content.encode('utf-8', errors='replace')) / 1024
                        files.append({'name': rel_path, 'content': content})
                        print(f'  │  + {rel_path:<58} {size_kb:>6.1f} KB')
                    except Exception as e:
                        print(f'  │  ⚠ skip {rel_path}: {e}')

        total_kb = sum(len(f['content'].encode('utf-8', errors='replace')) / 1024 for f in files)

        print(f'  ├{"─"*64}')
        print(f'  │  Files collected : {len(files)}')
        print(f'  │  Total size      : {total_kb:.1f} KB')
        if skipped_non_code: print(f'  │  Skipped non-code: {skipped_non_code} (docs/config/lock files)')
        if skipped_binary:   print(f'  │  Skipped binary  : {skipped_binary}')
        if skipped_empty:    print(f'  │  Skipped empty   : {skipped_empty}')
        print(f'  └{"─"*64}\n')

        if not files:
            print('  ⚠ No readable source files found. Nothing to scan.')
            sys.exit(0)

        payload = {
            'repo_name':           repo_name,
            'branch':              branch,
            'commit_sha':          commit_sha,
            'commit_author_email': actor,
            'scan_mode':           mode.upper(),
            'code_scan':           code_scan,
            'compliance_scan':     compliance_scan,
            'files':               files,
        }

        with open('/tmp/kodix_payload.json', 'w') as fh:
            json.dump(payload, fh)

        print(f'  ✓ Payload ready {len(files)} file(s) queued for AI scanning\n')
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_CODE_SCAN: ${{ inputs.code_scan }}
        INPUT_COMPLIANCE_SCAN: ${{ inputs.compliance_scan }}

    # ─────────────────────────────────────────────────────────────────────────
    # STEP 2 Submit to Kodix, poll for results, render full terminal report
    # ─────────────────────────────────────────────────────────────────────────
    - name: 🚀 Kodix Run scan
      id: kodix-run
      shell: python3 {0}
      run: |
        import json, os, sys, time, urllib.request, urllib.error

        API_URL = 'https://backend.kodixsecurity.com'
        api_key = os.environ.get('INPUT_API_KEY', '').strip()

        SEVERITY_ICONS = {'critical': '🔴', 'high': '🟠', 'medium': '🟡', 'low': '🔵'}
        SEVERITY_ORDER = ['critical', 'high', 'medium', 'low']

        # ── Validate key presence ────────────────────────────────────────
        if not api_key:
            print('\n  ✗ ERROR: api_key is not set.')
            print('  Pass it via:  with: api_key: ${{ inputs.api_key }}')
            sys.exit(1)

        # ── Load payload ─────────────────────────────────────────────────
        with open('/tmp/kodix_payload.json') as fh:
            payload = json.load(fh)

        file_count = len(payload.get('files', []))
        if file_count == 0:
            print('  ⚠ Empty payload nothing to scan.')
            gho = os.environ.get('GITHUB_OUTPUT', '')
            if gho:
                with open(gho, 'a') as fh:
                    fh.write('scan_id=skipped\nfindings_count=0\n')
            sys.exit(0)

        # ── Trigger scan ─────────────────────────────────────────────────
        print(f'  ┌{"─"*64}')
        print(f'  │  SUBMITTING TO KODIX API')
        print(f'  ├{"─"*64}')
        print(f'  │  Files   : {file_count}')
        total_kb = sum(len(f["content"].encode("utf-8", errors="replace")) / 1024 for f in payload["files"])
        print(f'  │  Size    : {total_kb:.1f} KB')
        print(f'  │  Sending payload…')

        req = urllib.request.Request(
            f'{API_URL}/api/scan/trigger',
            data=json.dumps(payload).encode(),
            headers={
                'Authorization': f'Bearer {api_key}',
                'Content-Type':  'application/json',
                'User-Agent':    'kodix-github-action/1.0',
            },
            method='POST',
        )

        try:
            with urllib.request.urlopen(req, timeout=120) as resp:
                trigger_data = json.loads(resp.read().decode())
        except urllib.error.HTTPError as e:
            body = e.read().decode()
            try:
                err = json.loads(body)
            except Exception:
                err = {'error': body}

            print(f'  └{"─"*64}')
            if e.code == 401:
                print('\n  ✗ AUTHENTICATION FAILED')
                print('  Your API key is invalid or has been revoked.')
                print('  Manage your keys at: kodixsecurity.com/profile → API Keys')
                sys.exit(1)
            elif e.code == 402:
                print('\n  ✗ INSUFFICIENT TOKEN BALANCE')
                print(f'  Balance  : {err.get("balance", "?")} tokens')
                print(f'  Required : {err.get("required", "?")} tokens')
                print(f'  Shortage : {err.get("shortage", "?")} tokens')
                print(f'  Purchase : kodixsecurity.com/tokens')
                sys.exit(1)
            elif e.code == 400 and err.get('code') == 'no_compliance_documents':
                print('\n  ✗ NO COMPLIANCE DOCUMENTS')
                print('  compliance_scan is "true" but your account has no compliance documents yet.')
                print('  Upload your standards at: kodixsecurity.com/profile?tab=compliance')
                print('  (or set compliance_scan to "false").')
                sys.exit(1)
            elif e.code == 429:
                print('\n  ✗ RATE LIMIT too many requests.')
                print('  Wait a few minutes and retry the workflow.')
                sys.exit(1)
            else:
                print(f'\n  ✗ API ERROR {e.code}: {err.get("error", body)}')
                sys.exit(1)
        except urllib.error.URLError as e:
            print(f'  └{"─"*64}')
            print(f'\n  ✗ NETWORK ERROR: Cannot reach Kodix API.')
            print(f'  Reason: {e.reason}')
            sys.exit(1)

        scan_id        = trigger_data['scan_id']
        tokens_charged = trigger_data.get('tokens_charged', '?')
        # Older servers do not report scan_type; they only ever ran the security check.
        scan_type      = trigger_data.get('scan_type') or 'code'
        has_code       = scan_type != 'compliance'
        has_comp       = scan_type != 'code'

        print(f'  │')
        print(f'  │  ✓ Scan accepted by API')
        print(f'  │  Scan ID        : {scan_id}')
        if scan_type != 'code':
            print(f'  │  Checks         : {"security + compliance" if scan_type == "both" else "compliance"}')
        print(f'  │  Tokens charged : {tokens_charged}')
        print(f'  └{"─"*64}\n')

        # ── Poll until completed ─────────────────────────────────────────
        status_url = f'{API_URL}/api/scan/{scan_id}/status'

        # Estimate time using content size when available (calibrated against real data).
        # Formula: 8s per-file overhead + 0.4s per KB of source content.
        # Falls back to 15s per file when size is unknown.
        if total_kb > 0 and file_count > 0:
            est_seconds = max(60, int(file_count * 8 + total_kb * 0.4))
        else:
            est_seconds = max(60, file_count * 15)

        if est_seconds < 120:
            est_label = f'~{est_seconds}s'
        elif est_seconds < 3600:
            est_label = f'~{est_seconds // 60} min'
        else:
            hrs = est_seconds // 3600
            mins = (est_seconds % 3600) // 60
            est_label = f'~{hrs}h {mins}m' if mins else f'~{hrs}h'

        print(f'  ┌{"─"*64}')
        print(f'  │  SCAN IN PROGRESS')
        print(f'  ├{"─"*64}')
        print(f'  │  3 AI models are scanning your code in parallel.')
        if has_code:
            print(f'  │  Security: only findings confirmed by 2+ models will be reported.')
        if has_comp:
            print(f'  │  Compliance: every violation of your standards reported by a model is included.')
        print(f'  │  Estimated time : {est_label} for {file_count} file(s).')
        print(f'  │  The scan runs in the background — this workflow will wait.')
        print(f'  ├{"─"*64}')

        SPINNERS = ['⠋', '⠙', '⠹', '⠸', '⠼', '⠴', '⠦', '⠧', '⠇', '⠏']

        def fmt_time(s):
            s = max(0, int(s))
            if s < 60:   return f'{s}s'
            if s < 3600: return f'{s // 60}m {s % 60:02d}s'
            return f'{s // 3600}h {(s % 3600) // 60:02d}m'

        scan_data          = None
        last_status        = ''
        last_prog_display  = ''
        poll_n             = 0
        consecutive_errors = 0
        MAX_CONSECUTIVE_ERRORS = 10
        # Stale detection: exit if status + progress haven't changed for 30 minutes.
        # This is smarter than a hard clock timeout — a slow but progressing scan
        # will never be killed, while a truly stuck scan fails fast.
        STALE_SECONDS      = 1800
        start_time         = time.time()
        last_change_time   = time.time()
        last_change_sig    = ''

        while True:
            poll_n += 1
            elapsed = int(time.time() - start_time)

            req2 = urllib.request.Request(
                status_url,
                headers={
                    'Authorization': f'Bearer {api_key}',
                    'User-Agent':    'kodix-github-action/1.0',
                },
            )
            try:
                with urllib.request.urlopen(req2, timeout=30) as resp2:
                    poll = json.loads(resp2.read().decode())
                consecutive_errors = 0
            except urllib.error.HTTPError as e:
                consecutive_errors += 1
                if e.code == 401:
                    print(f'  │  ✗ API key rejected during polling — key was revoked.')
                    print(f'  └{"─"*64}')
                    sys.exit(1)
                if e.code == 429:
                    print(f'  │  ⚠ Rate limited — backing off 60s… ({fmt_time(elapsed)} elapsed)', flush=True)
                    time.sleep(60)
                    continue
                print(f'  │  ⚠ HTTP {e.code} (error {consecutive_errors}/{MAX_CONSECUTIVE_ERRORS}) — retrying in 15s…', flush=True)
                if consecutive_errors >= MAX_CONSECUTIVE_ERRORS:
                    print(f'  └{"─"*64}')
                    print(f'\n  ✗ FATAL: {consecutive_errors} consecutive poll failures. Aborting.')
                    sys.exit(1)
                time.sleep(15)
                continue
            except Exception as e:
                consecutive_errors += 1
                print(f'  │  ⚠ {type(e).__name__} (error {consecutive_errors}/{MAX_CONSECUTIVE_ERRORS}) — retrying in 15s…', flush=True)
                if consecutive_errors >= MAX_CONSECUTIVE_ERRORS:
                    print(f'  └{"─"*64}')
                    print(f'\n  ✗ FATAL: {consecutive_errors} consecutive poll failures. Aborting.')
                    sys.exit(1)
                time.sleep(15)
                continue

            scan_data = poll.get('scan', {})
            status    = scan_data.get('status', 'unknown')
            progress  = scan_data.get('progress', {})
            comp_progress = scan_data.get('compliance_progress', {}) or {}

            # ── Stale detection ──────────────────────────────────────────────
            # Track a fingerprint of status+progress. If it hasn't changed for
            # STALE_SECONDS the backend is likely stuck, not just slow.
            change_sig = status + json.dumps(sorted(progress.items()) if progress else [], sort_keys=True) \
                       + json.dumps(sorted(comp_progress.items()) if comp_progress else [], sort_keys=True)
            if change_sig != last_change_sig:
                last_change_sig  = change_sig
                last_change_time = time.time()

            stale_for = int(time.time() - last_change_time)
            if stale_for > STALE_SECONDS:
                print(f'  ├{"─"*64}')
                print(f'  │  ✗ No progress for {stale_for // 60}m — scan appears stuck.')
                print(f'  │    Check the Kodix dashboard for details.')
                print(f'  └{"─"*64}')
                sys.exit(1)

            # ── Status transition banner ─────────────────────────────────────
            if status != last_status:
                ts    = time.strftime('%H:%M:%S UTC', time.gmtime())
                arrow = f'{last_status} → {status}' if last_status else status
                print(f'  ├{"─"*64}')
                print(f'  │  [{ts}]  {arrow.upper()}', flush=True)
                print(f'  ├{"─"*64}')
                last_status = status

            # ── Live animated heartbeat (printed every poll) ─────────────────
            spin      = SPINNERS[poll_n % len(SPINNERS)]
            remaining = max(0, est_seconds - elapsed)

            # Time-based progress bar: how far through the estimate are we
            time_pct = min(99, int(elapsed / est_seconds * 100)) if est_seconds > 0 else 0
            t_filled = int(time_pct / 2.5)   # 40-char wide bar
            t_bar    = '█' * t_filled + '░' * (40 - t_filled)

            print(f'  │', flush=True)
            print(f'  │  {spin}  elapsed: {fmt_time(elapsed):<10}  remaining: ~{fmt_time(remaining)}', flush=True)
            print(f'  │  ⏱  [{t_bar}] {time_pct:2d}%', flush=True)

            # Stale warning (shown after 2 minutes of no change)
            if stale_for > 120:
                print(f'  │  ⚠  No change for {fmt_time(stale_for)} — still waiting…', flush=True)

            # ── Per-model progress bars (one block per check) ────────────────
            def print_bars(bars, label=None):
                if label:
                    print(f'  │  ── {label}', flush=True)
                for model_name in sorted(bars.keys()):
                    v    = bars[model_name]
                    pct  = v.get('pct', 0) if isinstance(v, dict) else int(v)
                    stat = v.get('status', 'scanning') if isinstance(v, dict) else 'scanning'
                    done = stat in ('done', 'completed') or pct >= 100
                    m_filled = int(pct / 5)
                    m_bar    = '█' * m_filled + '░' * (20 - m_filled)
                    m_icon   = '✓' if done else spin
                    m_label  = 'done   ' if done else 'scanning'
                    print(f'  │  {m_icon}  {model_name:<10}  [{m_bar}]  {pct:3d}%  {m_label}', flush=True)

            if progress or comp_progress:
                if progress:
                    print_bars(progress, 'Security check' if scan_type == 'both' else None)
                if comp_progress:
                    print_bars(comp_progress, 'Compliance check' if scan_type == 'both' else None)
            else:
                print(f'  │  {spin}  Initializing AI models…', flush=True)

            if status == 'completed':
                duration = int(time.time() - start_time)
                print(f'  │')
                print(f'  ├{"─"*64}')
                print(f'  │  ✓ All models finished in {fmt_time(duration)}')
                print(f'  └{"─"*64}\n')
                break

            if status == 'failed':
                err_msg = scan_data.get('error', 'Unknown error')
                print(f'  ├{"─"*64}')
                print(f'  │  ✗ SCAN FAILED: {err_msg}')
                print(f'  └{"─"*64}')
                sys.exit(1)

            if status == 'cancelled':
                print(f'  ├{"─"*64}')
                print(f'  │  ✗ SCAN CANCELLED: this scan was cancelled via the dashboard.')
                print(f'  └{"─"*64}')
                sys.exit(1)

            # Adaptive poll interval: frequent while fresh, slower for long scans
            poll_interval = 10 if elapsed < 300 else 30
            time.sleep(poll_interval)

        # ── Render results ────────────────────────────────────────────────
        def render(kind, findings, score, sev_breakdown, pdf_url):
            is_comp    = kind == 'compliance'
            n_total    = len(findings)
            grade      = 'A+' if score >= 95 else 'A' if score >= 90 else 'B' if score >= 75 else 'C' if score >= 60 else 'D' if score >= 40 else 'F'
            score_icon = '🟢' if score >= 75 else '🟡' if score >= 50 else '🔴'

            print(f'{"═"*68}')
            print(f'  {"📑  KODIX COMPLIANCE RESULTS" if is_comp else "🛡️  KODIX SECURITY SCAN RESULTS"}')
            print(f'{"═"*68}')
            print(f'  Scan ID   : {scan_id}')
            print(f'  Score     : {score_icon} {score}/100  (Grade: {grade})')
            print(f'  {"Violations" if is_comp else "Findings  "}: {n_total} {"violation(s) of your standards" if is_comp else "confirmed vulnerability(ies)"}')
            print(f'{"─"*68}')
            print(f'  {"Severity":<12}  {"Count":>5}  {"Visual bar"}')
            print(f'  {"─"*12}  {"─"*5}  {"─"*40}')

            for sev in SEVERITY_ORDER:
                count = sev_breakdown.get(sev, 0)
                bar   = '█' * min(count, 40) if count > 0 else '—'
                icon  = SEVERITY_ICONS.get(sev, '⚪')
                print(f'  {icon} {sev.upper():<10}  {count:>5}  {bar}')

            print(f'{"═"*68}')

            if findings:
                print(f'\n  {"VIOLATION" if is_comp else "VULNERABILITY"} DETAILS  ({n_total} finding(s))')
                print(f'{"─"*68}')

                for i, finding in enumerate(findings, 1):
                    sev       = (finding.get('severity') or 'low').lower()
                    icon      = SEVERITY_ICONS.get(sev, '⚪')
                    sev_upper = sev.upper()
                    fname     = (finding.get('file_name') or finding.get('fileName') or 'unknown file')
                    if len(fname) > 52: fname = '…' + fname[-50:]
                    line      = finding.get('line_number') or finding.get('lineNumber') or '?'
                    title     = (finding.get('title') or 'Untitled finding')
                    confirmed = finding.get('confirmed_by') or finding.get('confirmedBy') or []
                    models_str = ', '.join(confirmed) if confirmed else 'unknown'
                    description = (finding.get('description') or '').strip()

                    print(f'\n  ┌─ [{i}/{n_total}] {icon} {sev_upper}')
                    print(f'  │  File    : {fname}')
                    print(f'  │  Line    : {line}')
                    print(f'  │  Title   : {title}')
                    if is_comp and finding.get('standard_reference'):
                        print(f'  │  Standard: {str(finding["standard_reference"])[:120]}')
                    if description:
                        # Wrap long descriptions at 60 chars
                        words = description.split()
                        line_buf, lines_out = [], []
                        for w in words:
                            if sum(len(x)+1 for x in line_buf) + len(w) > 60:
                                lines_out.append(' '.join(line_buf))
                                line_buf = [w]
                            else:
                                line_buf.append(w)
                        if line_buf: lines_out.append(' '.join(line_buf))
                        print(f'  │  Details : {lines_out[0]}')
                        for extra_line in lines_out[1:]:
                            print(f'  │            {extra_line}')
                    print(f'  │  {"Reported by" if is_comp else "Models  "}: {models_str}')

                    ctx = (finding.get('code_context') or finding.get('codeContext') or '').strip()
                    if ctx:
                        print(f'  │')
                        for code_line in ctx.split('\n')[:6]:
                            print(f'  │    {code_line[:64]}')

                    print(f'  └{"─"*64}')

            print(f'\n{"─"*68}')
            if pdf_url:
                print(f'  📄 Full PDF {"compliance " if is_comp else ""}report  : {pdf_url}')

        # security check (older servers only ever return this)
        sec_findings  = scan_data.get('findings', []) if has_code else []
        sec_score     = scan_data.get('consensus_score') or 0
        sec_breakdown = (scan_data.get('severity_breakdown') or {}) if has_code else {}
        pdf_url       = (scan_data.get('pdf_url') or '') if has_code else ''
        # compliance check
        comp_findings  = scan_data.get('compliance_findings', []) if has_comp else []
        comp_score     = scan_data.get('compliance_score') or 0
        comp_breakdown = (scan_data.get('compliance_severity') or {}) if has_comp else {}
        comp_pdf_url   = (scan_data.get('compliance_pdf_url') or '') if has_comp else ''

        if has_code:
            render('security', sec_findings, sec_score, sec_breakdown, pdf_url)
        if has_comp:
            render('compliance', comp_findings, comp_score, comp_breakdown, comp_pdf_url)

        print(f'  🌐 Dashboard        : https://kodixsecurity.com/scan/{scan_id}')
        if has_comp:
            print(f'  💬 Ask about the compliance report: https://kodixsecurity.com/scan/{scan_id}/chat')
        print(f'{"═"*68}')
        print(f'  ✓ Kodix scan complete!\n')

        # ── Write GitHub outputs ──────────────────────────────────────────
        gho = os.environ.get('GITHUB_OUTPUT', '')
        if gho:
            with open(gho, 'a') as fh:
                fh.write(f'scan_id={scan_id}\n')
                fh.write(f'scan_type={scan_type}\n')
                fh.write(f'findings_count={len(sec_findings)}\n')
                fh.write(f'critical_count={sec_breakdown.get("critical", 0)}\n')
                fh.write(f'high_count={sec_breakdown.get("high", 0)}\n')
                fh.write(f'medium_count={sec_breakdown.get("medium", 0)}\n')
                fh.write(f'low_count={sec_breakdown.get("low", 0)}\n')
                fh.write(f'consensus_score={sec_score if has_code else ""}\n')
                fh.write(f'pdf_url={pdf_url}\n')
                fh.write(f'compliance_findings_count={len(comp_findings)}\n')
                fh.write(f'compliance_critical_count={comp_breakdown.get("critical", 0)}\n')
                fh.write(f'compliance_high_count={comp_breakdown.get("high", 0)}\n')
                fh.write(f'compliance_medium_count={comp_breakdown.get("medium", 0)}\n')
                fh.write(f'compliance_low_count={comp_breakdown.get("low", 0)}\n')
                fh.write(f'compliance_score={comp_score if has_comp else ""}\n')
                fh.write(f'compliance_pdf_url={comp_pdf_url}\n')
      env:
        INPUT_API_KEY: ${{ inputs.api_key }}
